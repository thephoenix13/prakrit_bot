# Prakrit AI — Shy Bot Docker Compose
# For local development and Azure Container Instances

version: '3.8'

services:
  shy-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shy-bot
    restart: unless-stopped
    ports:
      - "3000:3000"  # Health check endpoint
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    volumes:
      # Persist WhatsApp session
      - openwa-session:/app/.openwa-auth
      # Persist logs
      - bot-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - shy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: shy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  openwa-session:
    driver: local
  bot-logs:
    driver: local
  redis-data:
    driver: local

networks:
  shy-network:
    driver: bridge
